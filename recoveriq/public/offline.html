<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RecoverIQ — Offline</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; background: #0f172a; color: #e2e8f0;
      display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    .card { text-align: center; padding: 2rem; }
    h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
    p { color: #94a3b8; font-size: 0.9rem; max-width: 320px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You're offline</h1>
    <p>RecoverIQ needs a connection to load live recovery data. Reconnect and the page will reload automatically.</p>
  </div>
  <script>window.addEventListener('online', () => location.reload())</script>
</body>
</html>
